<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Kang Force</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 50px; text-align: center; }
        .container { max-width: 400px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); text-align: left; }
        input { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #28a745; color: white; border: none; cursor: pointer; border-radius: 4px; }
        button:hover { background: #218838; }
        .links { margin-top: 15px; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Criar Conta - Kang Force</h2>
        <form action="cadastro.php" method="POST">
            <label>Nome Completo:</label>
            <input type="text" name="nome" required>
            <label>Email:</label>
            <input type="email" name="email" required>
            <label>Senha:</label>
            <input type="password" name="senha" required>
            <button type="submit">Finalizar Cadastro</button>
        </form>
        <div class="links">
            <p>Já tem uma conta? <a href="index.html">Faça Login</a></p>
        </div>
    </div>
</body>
</html>

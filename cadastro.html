<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar-se - KANG FORCE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#f3f4f6] min-h-screen flex flex-col justify-between items-center p-4">

    <div class="w-full max-w-md bg-white rounded-xl shadow-md border border-gray-100 p-8 mt-12">
        <div class="flex flex-col items-center mb-6">
            <div class="text-[#1e3a8a] text-4xl font-black tracking-tighter flex items-center mb-4">
                <i class="fa-solid fa-angles-up transform rotate-45 mr-1"></i>
                <div class="flex flex-col leading-none">
                    <span class="text-xl font-bold text-slate-800 tracking-wide">KANG</span>
                    <span class="text-xl font-black text-slate-500 tracking-wider">FORCE</span>
                </div>
            </div>
            <h1 class="text-xl font-semibold text-slate-800 text-center">Criar sua conta KANG FORCE</h1>
            <p class="text-sm text-gray-500 text-center mt-1">Explore a rede profissional de inovação.</p>
        </div>

        <form action="cadastro.php" method="POST" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Nome de Usuário</label>
                <input type="text" name="username" required placeholder="ex: jhon_doe" 
                       class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-900 text-sm">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Endereço de E-mail</label>
                <input type="email" name="email" required placeholder="nome@empresa.com" 
                       class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-900 text-sm">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Senha</label>
                <input type="password" name="senha" required placeholder="No mínimo 8 caracteres" 
                       class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-900 text-sm">
            </div>

            <button type="submit" class="w-full bg-[#1e3a8a] hover:bg-[#172e6b] text-white font-medium py-2 px-4 rounded-lg transition text-sm">
                Finalizar Cadastro
            </button>
        </form>

        <p class="text-center text-sm text-gray-600 mt-6">
            Já tem uma conta? <a href="index.html" class="text-[#1e3a8a] font-semibold hover:underline">Entrar</a>
        </p>
    </div>

    <footer class="text-center text-xs text-gray-500 my-6">
        <p>&copy; 2026 KANG FORCE, Inc.</p>
    </footer>
</body>
</html>
